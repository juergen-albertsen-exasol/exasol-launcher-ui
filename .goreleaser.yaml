# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: exasol-launcher-ui

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - main: ./cmd/exasol-launcher-ui
    binary: exasol-launcher-ui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_arm64
      - darwin_amd64
      - linux_arm64
      - linux_amd64
      - windows_amd64

archives:
  - formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^(?i)docs'
      - '^(?i)test'
      - '^(?i)chore'

release:
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
      name_template: install.sh
